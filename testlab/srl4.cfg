set / system information location "BGPShark Test Lab"
set / system information contact "testlab"

# Interface to srl3 (iBGP within AS65002) - 10.0.34.0/24
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.34.4/24

# Interface to srl1 (eBGP to AS65001) - 10.0.14.0/24
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.0.14.4/24

# Interface to srl2 (eBGP to AS65001) - 10.0.24.0/24
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 subinterface 0 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 10.0.24.4/24

# Loopback
set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 4.4.4.4/32

# Network instance
set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface system0.0

# OSPF configuration (for iBGP loopback reachability)
set / network-instance default protocols ospf instance main admin-state enable
set / network-instance default protocols ospf instance main version ospf-v2
set / network-instance default protocols ospf instance main router-id 4.4.4.4
set / network-instance default protocols ospf instance main area 0.0.0.0 interface ethernet-1/1.0 interface-type point-to-point
set / network-instance default protocols ospf instance main area 0.0.0.0 interface system0.0 passive true

# BGP configuration
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65002
set / network-instance default protocols bgp router-id 4.4.4.4
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable

# iBGP peer group (using loopback)
set / network-instance default protocols bgp group ibgp
set / network-instance default protocols bgp group ibgp export-policy [ export-all ]
set / network-instance default protocols bgp group ibgp import-policy [ accept-all ]
set / network-instance default protocols bgp group ibgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group ibgp next-hop-self true
set / network-instance default protocols bgp group ibgp local-as as-number 65002
set / network-instance default protocols bgp group ibgp transport local-address 4.4.4.4

# eBGP peer group
set / network-instance default protocols bgp group ebgp
set / network-instance default protocols bgp group ebgp export-policy [ export-all ]
set / network-instance default protocols bgp group ebgp import-policy [ accept-all ]
set / network-instance default protocols bgp group ebgp afi-safi ipv4-unicast admin-state enable

# iBGP neighbor: srl3 (via loopback)
set / network-instance default protocols bgp neighbor 3.3.3.3
set / network-instance default protocols bgp neighbor 3.3.3.3 admin-state enable
set / network-instance default protocols bgp neighbor 3.3.3.3 peer-as 65002
set / network-instance default protocols bgp neighbor 3.3.3.3 peer-group ibgp

# eBGP neighbor: srl1
set / network-instance default protocols bgp neighbor 10.0.14.1
set / network-instance default protocols bgp neighbor 10.0.14.1 admin-state enable
set / network-instance default protocols bgp neighbor 10.0.14.1 peer-as 65001
set / network-instance default protocols bgp neighbor 10.0.14.1 peer-group ebgp

# eBGP neighbor: srl2
set / network-instance default protocols bgp neighbor 10.0.24.2
set / network-instance default protocols bgp neighbor 10.0.24.2 admin-state enable
set / network-instance default protocols bgp neighbor 10.0.24.2 peer-as 65001
set / network-instance default protocols bgp neighbor 10.0.24.2 peer-group ebgp

# Routing policies
set / routing-policy policy export-all default-action policy-result accept
set / routing-policy policy accept-all default-action policy-result accept

commit now
