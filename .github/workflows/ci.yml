name: CI

# deploy.yml only runs on pushes to main, so on its own it checks a change after
# it has already landed. This runs the same checks on the pull request, which is
# the point at which a failure is still cheap. The jobs live in checks.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the run for the previous one moot, and with
# the e2e job split into shards each run holds four runners — so stacked pushes
# would otherwise queue behind work nobody will read. Only this workflow:
# deploy.yml must never be cancelled halfway through a deploy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
