name: CI

# deploy.yml only runs on pushes to main, so on its own it checks a change after
# it has already landed. This runs the same checks on the pull request, which is
# the point at which a failure is still cheap.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun test

      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # The browser is the slowest thing in this job and the least interesting:
      # a good day is a 25s download from cdn.playwright.dev, a bad one has been
      # nearly ten minutes. It only changes when Playwright does, so key the
      # cache on that and let a version bump be the only run that pays.
      - name: Note the Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # --only-shell skips the full Chrome build (177MB) and takes the headless
      # shell (114MB) on its own, which is what a headless run launches anyway.
      # A `--headed` or `--ui` run needs the full browser, so those stay local.
      # The install is a no-op once the cache has restored the browser; the apt
      # side of --with-deps still runs, and is fast and off the Playwright CDN.
      - name: Install Chromium
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
